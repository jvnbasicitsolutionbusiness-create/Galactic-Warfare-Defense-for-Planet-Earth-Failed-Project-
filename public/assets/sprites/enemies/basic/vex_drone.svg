<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="540" height="340">
  <!-- Common Alien (ALN-001 / Vex Drone) Sprite Sheet Reference -->
  <!-- Palette: Body #4c3b7a purple | Accent #7c6ab5 lighter purple | Eye #e879f9 pink-magenta | Core #a855f7 violet | Dark #1a0a2e -->
  <defs><style>.lbl{font:bold 8px monospace;fill:#94a3b8}</style></defs>
  <rect width="540" height="340" fill="#0f172a"/>
  <rect width="540" height="20" fill="#1e293b"/>
  <text x="6" y="14" style="font:bold 10px monospace;fill:#a78bfa">COMMON ALIEN (ALN-001)</text>
  <text x="300" y="14" style="font:bold 8px monospace;fill:#94a3b8">SPRITE SHEET — ANIMATION FRAMES (IDLE → DEFEAT)</text>

  <!-- Row labels -->
  <text x="4" y="42"  class="lbl">IDLE (6)</text>
  <text x="4" y="112" class="lbl">WALK (6)</text>
  <text x="4" y="182" class="lbl">ATTACK (8)</text>
  <text x="4" y="242" class="lbl">TAKE DAMAGE (4)</text>
  <text x="4" y="302" class="lbl">DEATH (6)</text>

  <!-- Shared alien body drawing macro (inline repeated) -->
  <!-- IDLE row -->
  <g transform="translate(60,24)">
    <!-- Frame 0: canonical idle pose -->
    <rect x="0" y="0" width="48" height="66" fill="#0f172a" rx="2"/>
    <!-- Ground shadow -->
    <ellipse cx="24" cy="62" rx="16" ry="4" fill="#000" opacity="0.22"/>
    <!-- Legs (slightly bent knees) -->
    <line x1="15" y1="38" x2="4"  y2="54" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <line x1="32" y1="38" x2="42" y2="54" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <!-- Feet / claws -->
    <ellipse cx="4"  cy="55" rx="4" ry="2.5" fill="#7c6ab5"/>
    <ellipse cx="42" cy="55" rx="4" ry="2.5" fill="#7c6ab5"/>
    <!-- Body torso (bulbous) -->
    <ellipse cx="24" cy="28" rx="14" ry="18" fill="#4c3b7a"/>
    <!-- Body ridges -->
    <line x1="17" y1="16" x2="15" y2="36" stroke="#3a2a5e" stroke-width="1.5" opacity="0.6"/>
    <line x1="31" y1="16" x2="33" y2="36" stroke="#3a2a5e" stroke-width="1.5" opacity="0.6"/>
    <!-- Arms (long, slightly bent) -->
    <line x1="11" y1="24" x2="-4" y2="38" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <line x1="37" y1="24" x2="52" y2="38" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <!-- Clawed hands -->
    <circle cx="-4" cy="38" r="4" fill="#7c6ab5"/>
    <circle cx="52" cy="38" r="4" fill="#7c6ab5"/>
    <!-- Chest core orb -->
    <circle cx="24" cy="28" r="7" fill="#a855f7" opacity="0.35"/>
    <circle cx="24" cy="28" r="4" fill="#a855f7" opacity="0.85"/>
    <!-- Neck -->
    <ellipse cx="24" cy="10" rx="8" ry="6" fill="#4c3b7a"/>
    <!-- Head (large cranium) -->
    <rect x="9" y="-12" width="30" height="22" fill="#4c3b7a" rx="6"/>
    <!-- Cranial ridges (top bumps) -->
    <polygon points="14,-12 11,-19 17,-19" fill="#5e4d8a"/>
    <polygon points="20,-12 17,-19 23,-19" fill="#5e4d8a"/>
    <polygon points="26,-12 23,-19 29,-19" fill="#5e4d8a"/>
    <polygon points="32,-12 29,-19 35,-19" fill="#5e4d8a"/>
    <!-- Eyes (three glowing) -->
    <circle cx="16" cy="-3" r="4.5" fill="#e879f9"/>
    <circle cx="24" cy="-5" r="3"   fill="#e879f9"/>
    <circle cx="32" cy="-3" r="4.5" fill="#e879f9"/>
    <!-- Eye glow rings -->
    <circle cx="16" cy="-3" r="6"   fill="none" stroke="#e879f9" stroke-width="1" opacity="0.4"/>
    <circle cx="32" cy="-3" r="6"   fill="none" stroke="#e879f9" stroke-width="1" opacity="0.4"/>
    <!-- Mouth -->
    <rect x="16" y="4" width="14" height="3" fill="#0a0015"/>
    <!-- Teeth -->
    <polygon points="17,4 18,7 19,4" fill="#7c6ab5"/>
    <polygon points="21,4 22,7 23,4" fill="#7c6ab5"/>
    <polygon points="25,4 26,7 27,4" fill="#7c6ab5"/>
  </g>

  <!-- Frames 1-5 abbreviated -->
  <g transform="translate(111,24)">
    <rect x="0"   y="0" width="48" height="66" fill="#0f172a" rx="2"/>
    <text x="24" y="36" class="lbl" text-anchor="middle" fill="#334155">1</text>
    <rect x="52"  y="0" width="48" height="66" fill="#0f172a" rx="2"/>
    <text x="76" y="36" class="lbl" text-anchor="middle" fill="#334155">2</text>
    <rect x="104" y="0" width="48" height="66" fill="#0f172a" rx="2"/>
    <text x="128" y="36" class="lbl" text-anchor="middle" fill="#334155">3</text>
    <rect x="156" y="0" width="48" height="66" fill="#0f172a" rx="2"/>
    <text x="180" y="36" class="lbl" text-anchor="middle" fill="#334155">4</text>
    <rect x="208" y="0" width="48" height="66" fill="#0f172a" rx="2"/>
    <text x="232" y="36" class="lbl" text-anchor="middle" fill="#334155">5</text>
  </g>

  <!-- WALK row (key frame with shifted legs) -->
  <g transform="translate(60,94)">
    <rect x="0" y="0" width="48" height="66" fill="#0f172a" rx="2"/>
    <ellipse cx="24" cy="62" rx="16" ry="4" fill="#000" opacity="0.22"/>
    <!-- Legs walking (offset) -->
    <line x1="15" y1="38" x2="0"  y2="52" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <line x1="32" y1="38" x2="44" y2="50" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="0"  cy="53" rx="4" ry="2.5" fill="#7c6ab5"/>
    <ellipse cx="44" cy="51" rx="4" ry="2.5" fill="#7c6ab5"/>
    <ellipse cx="24" cy="28" rx="14" ry="18" fill="#4c3b7a"/>
    <line x1="17" y1="16" x2="15" y2="36" stroke="#3a2a5e" stroke-width="1.5" opacity="0.6"/>
    <line x1="31" y1="16" x2="33" y2="36" stroke="#3a2a5e" stroke-width="1.5" opacity="0.6"/>
    <!-- Arms swinging -->
    <line x1="11" y1="24" x2="-6" y2="35" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <line x1="37" y1="24" x2="54" y2="33" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-6" cy="35" r="4" fill="#7c6ab5"/>
    <circle cx="54" cy="33" r="4" fill="#7c6ab5"/>
    <circle cx="24" cy="28" r="7" fill="#a855f7" opacity="0.35"/>
    <circle cx="24" cy="28" r="4" fill="#a855f7" opacity="0.85"/>
    <ellipse cx="24" cy="10" rx="8" ry="6" fill="#4c3b7a"/>
    <rect x="9" y="-11" width="30" height="22" fill="#4c3b7a" rx="6"/>
    <polygon points="14,-11 11,-18 17,-18" fill="#5e4d8a"/>
    <polygon points="20,-11 17,-18 23,-18" fill="#5e4d8a"/>
    <polygon points="26,-11 23,-18 29,-18" fill="#5e4d8a"/>
    <polygon points="32,-11 29,-18 35,-18" fill="#5e4d8a"/>
    <circle cx="16" cy="-2" r="4.5" fill="#e879f9"/>
    <circle cx="24" cy="-4" r="3"   fill="#e879f9"/>
    <circle cx="32" cy="-2" r="4.5" fill="#e879f9"/>
    <rect x="16" y="5" width="14" height="3" fill="#0a0015"/>
    <polygon points="17,5 18,8 19,5" fill="#7c6ab5"/>
    <polygon points="21,5 22,8 23,5" fill="#7c6ab5"/>
    <polygon points="25,5 26,8 27,5" fill="#7c6ab5"/>
  </g>

  <!-- ATTACK row — key attack pose with energy orb at claw -->
  <g transform="translate(60,164)">
    <!-- Full attack frame with energy claw -->
    <rect x="0" y="0" width="48" height="66" fill="#0f172a" rx="2"/>
    <ellipse cx="24" cy="62" rx="16" ry="4" fill="#000" opacity="0.25"/>
    <line x1="15" y1="38" x2="6"  y2="54" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <line x1="32" y1="38" x2="40" y2="54" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="6"  cy="55" rx="4" ry="2.5" fill="#7c6ab5"/>
    <ellipse cx="40" cy="55" rx="4" ry="2.5" fill="#7c6ab5"/>
    <ellipse cx="24" cy="28" rx="14" ry="18" fill="#4c3b7a"/>
    <line x1="17" y1="16" x2="15" y2="36" stroke="#3a2a5e" stroke-width="1.5" opacity="0.6"/>
    <line x1="31" y1="16" x2="33" y2="36" stroke="#3a2a5e" stroke-width="1.5" opacity="0.6"/>
    <!-- Attack: right arm extended forward -->
    <line x1="11" y1="24" x2="-5" y2="32" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <line x1="37" y1="24" x2="58" y2="28" stroke="#4c3b7a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-5" cy="32" r="4" fill="#7c6ab5"/>
    <!-- Energy attack orb at extended claw -->
    <circle cx="62" cy="28" r="7" fill="#a855f7" opacity="0.3"/>
    <circle cx="62" cy="28" r="5" fill="#a855f7" opacity="0.9"/>
    <circle cx="60" cy="26" r="2" fill="#e879f9" opacity="0.8"/>
    <circle cx="24" cy="28" r="7" fill="#a855f7" opacity="0.5"/>
    <circle cx="24" cy="28" r="4" fill="#a855f7"/>
    <ellipse cx="24" cy="10" rx="8" ry="6" fill="#4c3b7a"/>
    <rect x="9" y="-12" width="30" height="22" fill="#4c3b7a" rx="6"/>
    <polygon points="14,-12 11,-19 17,-19" fill="#5e4d8a"/>
    <polygon points="20,-12 17,-19 23,-19" fill="#5e4d8a"/>
    <polygon points="26,-12 23,-19 29,-19" fill="#5e4d8a"/>
    <polygon points="32,-12 29,-19 35,-19" fill="#5e4d8a"/>
    <!-- Eyes glowing bright on attack -->
    <circle cx="16" cy="-3" r="5"   fill="#e879f9"/>
    <circle cx="24" cy="-5" r="3.5" fill="#e879f9"/>
    <circle cx="32" cy="-3" r="5"   fill="#e879f9"/>
    <circle cx="16" cy="-3" r="8"   fill="none" stroke="#e879f9" stroke-width="1.5" opacity="0.5"/>
    <circle cx="32" cy="-3" r="8"   fill="none" stroke="#e879f9" stroke-width="1.5" opacity="0.5"/>
    <rect x="16" y="4" width="14" height="3" fill="#0a0015"/>
    <polygon points="17,4 18,7 19,4" fill="#7c6ab5"/>
    <polygon points="21,4 22,7 23,4" fill="#7c6ab5"/>
    <polygon points="25,4 26,7 27,4" fill="#7c6ab5"/>
  </g>

  <!-- TAKE DAMAGE row -->
  <g transform="translate(60,224)">
    <!-- Flash/stagger frame -->
    <rect x="0" y="0" width="48" height="66" fill="#0f172a" rx="2"/>
    <ellipse cx="24" cy="62" rx="16" ry="4" fill="#000" opacity="0.2"/>
    <line x1="15" y1="40" x2="6"  y2="55" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <line x1="32" y1="40" x2="40" y2="55" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="6"  cy="56" rx="4" ry="2.5" fill="#7c6ab5"/>
    <ellipse cx="40" cy="56" rx="4" ry="2.5" fill="#7c6ab5"/>
    <ellipse cx="24" cy="30" rx="14" ry="18" fill="#4c3b7a"/>
    <!-- Arms raised in reaction -->
    <line x1="11" y1="26" x2="-2" y2="18" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <line x1="37" y1="26" x2="50" y2="18" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-2" cy="18" r="4" fill="#7c6ab5"/>
    <circle cx="50" cy="18" r="4" fill="#7c6ab5"/>
    <!-- Damage flash overlay -->
    <rect x="9" y="-14" width="30" height="76" fill="#fff" opacity="0.18" rx="4"/>
    <!-- Hit sparks -->
    <line x1="6"  y1="10" x2="0"  y2="4"  stroke="#e879f9" stroke-width="2"/>
    <line x1="40" y1="8"  x2="46" y2="2"  stroke="#e879f9" stroke-width="2"/>
    <line x1="24" y1="4"  x2="24" y2="-4" stroke="#fff" stroke-width="2"/>
    <circle cx="24" cy="30" r="7" fill="#a855f7" opacity="0.35"/>
    <circle cx="24" cy="30" r="4" fill="#a855f7" opacity="0.85"/>
    <ellipse cx="24" cy="12" rx="8" ry="6" fill="#4c3b7a"/>
    <rect x="9" y="-14" width="30" height="22" fill="#4c3b7a" rx="6"/>
    <circle cx="16" cy="-5" r="4.5" fill="#e879f9"/>
    <circle cx="24" cy="-7" r="3"   fill="#e879f9"/>
    <circle cx="32" cy="-5" r="4.5" fill="#e879f9"/>
    <polygon points="14,-14 11,-21 17,-21" fill="#5e4d8a"/>
    <polygon points="20,-14 17,-21 23,-21" fill="#5e4d8a"/>
    <polygon points="26,-14 23,-21 29,-21" fill="#5e4d8a"/>
    <polygon points="32,-14 29,-21 35,-21" fill="#5e4d8a"/>
  </g>

  <!-- DEATH row — final prone frame -->
  <g transform="translate(60,284)">
    <rect x="0" y="0" width="48" height="48" fill="#0f172a" rx="2"/>
    <ellipse cx="26" cy="42" rx="20" ry="5" fill="#000" opacity="0.3"/>
    <!-- Prone body -->
    <ellipse cx="26" cy="32" rx="20" ry="9" fill="#4c3b7a" opacity="0.8"/>
    <!-- Head fallen sideways -->
    <ellipse cx="8" cy="28" rx="10" ry="8" fill="#4c3b7a" opacity="0.8"/>
    <circle cx="8"  cy="26" r="3" fill="#e879f9" opacity="0.5"/>
    <!-- Arm draped -->
    <line x1="12" y1="32" x2="2" y2="40" stroke="#4c3b7a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="2" cy="40" r="3.5" fill="#7c6ab5" opacity="0.8"/>
    <!-- Core dim -->
    <circle cx="26" cy="32" r="4" fill="#a855f7" opacity="0.2"/>
  </g>
</svg>
