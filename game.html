  <!-- ── Auth Guard ──────────────────────────────────────────
       Same logic as index.html — must run before game scripts.
  ──────────────────────────────────────────────────────────── -->
  <script>
  (function () {
    // Support both old token key (gw_id_token) and new (gw_session_token)
    var TOKEN_KEY  = 'gw_session_token';
    var TOKEN_KEY2 = 'gw_id_token';
    var AUTH_PAGE  = 'auth.html';
    var token = localStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY2);
    var mode = sessionStorage.getItem('gw_mode');
    var authorized = sessionStorage.getItem('gw_entry_authorized') === '1';
    if (!authorized || (mode !== 'guest' && !token)) {
      window.location.replace(AUTH_PAGE);
      throw new Error('[Auth Guard] No session — redirecting to ' + AUTH_PAGE);
    }
    if (mode === 'guest') return;
    // Background verify — non-blocking, adapts to backend OR direct mode.
    setTimeout(function () {
      if (!window.GWNet) return;
      window.GWNet.verify(token)
        .then(function (d) {
          if (!d || !d.ok) {
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(TOKEN_KEY2);
            localStorage.removeItem('gw_user');
            sessionStorage.removeItem('gw_entry_authorized');
            sessionStorage.removeItem('gw_mode');
            window.location.replace(AUTH_PAGE);
          }
        })
        .catch(function () {});
    }, 1200);
  })();
  </script>

<body class="game-page">

  <div id="game-container" role="main" aria-label="Game battlefield"></div>
  <button id="fullscreen-toggle" type="button" aria-label="Enter full screen" title="Enter full screen" hidden>
    <span aria-hidden="true">⛶</span>
    <span class="sr-only">Full screen</span>
  </button>
  <p id="fullscreen-status" class="sr-only" role="status" aria-live="polite"></p>
  <script>
  (function () {
    var button = document.getElementById('fullscreen-toggle');
    var status = document.getElementById('fullscreen-status');
    var target = document.getElementById('game-container');
    if (!button || !target) return;

    function isFullscreen() {
      return document.fullscreenElement === target || document.webkitFullscreenElement === target;
    }
    function updateButton() {
      var label = isFullscreen() ? 'Exit full screen' : 'Enter full screen';
      button.setAttribute('aria-label', label);
      button.title = label;
    }
    function showError(error) {
      console.warn('[GW] Full-screen mode is unavailable:', error);
      if (status) status.textContent = 'Full-screen mode is unavailable in this browser.';
    }

    function toggleFullscreen() {
      var action;
      var supported = false;
      try {
        if (isFullscreen()) {
          if (document.exitFullscreen) { action = document.exitFullscreen(); supported = true; }
          else if (document.webkitExitFullscreen) { action = document.webkitExitFullscreen(); supported = true; }
        } else {
          if (target.requestFullscreen) { action = target.requestFullscreen(); supported = true; }
          else if (target.webkitRequestFullscreen) { action = target.webkitRequestFullscreen(); supported = true; }
        }
      } catch (error) {
        showError(error);
        return;
      }
      if (!supported) {
        showError(new Error('Fullscreen API is not supported.'));
      } else if (action && typeof action.then === 'function') {
        action.then(updateButton).catch(showError);
      } else {
        window.setTimeout(updateButton, 0);
      }
    }
    window.GWFullscreen = { toggle: toggleFullscreen };
    button.addEventListener('click', toggleFullscreen);
    window.addEventListener('gw:pause-open', function () { button.hidden = false; });
    window.addEventListener('gw:pause-close', function () { button.hidden = true; });
    document.addEventListener('keydown', function (event) {
      var targetTag = event.target && event.target.tagName;
      if (event.key.toLowerCase() !== 'f' || event.altKey || event.ctrlKey || event.metaKey ||
          ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(targetTag) !== -1) return;
      event.preventDefault();
      toggleFullscreen();
    });
    document.addEventListener('fullscreenchange', updateButton);
    document.addEventListener('webkitfullscreenchange', updateButton);
  })();
  </script>

  <!-- Loading screen -->
