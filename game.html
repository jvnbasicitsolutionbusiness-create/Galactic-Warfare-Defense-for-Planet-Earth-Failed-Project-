  <!-- Runtime must load before the auth guard -->
  <script src="public/js/runtime.js"></script>

  <!-- Authentication guard: preserve existing logic -->
  <script>
    (function () {
      var TOKEN_KEY = 'gw_session_token';
      var TOKEN_KEY2 = 'gw_id_token';
      var AUTH_PAGE = 'auth.html';

      var token =
        localStorage.getItem(TOKEN_KEY) ||
        localStorage.getItem(TOKEN_KEY2);

      var mode = sessionStorage.getItem('gw_mode');
      var authorized =
        sessionStorage.getItem('gw_entry_authorized') === '1';

      if (!authorized || (mode !== 'guest' && !token)) {
        window.location.replace(AUTH_PAGE);
        throw new Error(
          '[Auth Guard] No session — redirecting to ' + AUTH_PAGE
        );
      }

      if (mode === 'guest') return;

      setTimeout(function () {
        if (!window.GWNet) return;

        window.GWNet.verify(token)
          .then(function (d) {
            if (!d || !d.ok) {
              localStorage.removeItem(TOKEN_KEY);
              localStorage.removeItem(TOKEN_KEY2);
              localStorage.removeItem('gw_user');

              sessionStorage.removeItem('gw_entry_authorized');
              sessionStorage.removeItem('gw_mode');

              window.location.replace(AUTH_PAGE);
            }
          })
          .catch(function () {});
      }, 1200);
    })();
  </script>

<body class="game-page">

  <!-- Fullscreen button -->
  <button

    aria-label="Enter full screen"

    <span class="sr-only">Full screen</span>

    id="fullscreen-status"
    class="sr-only"
    role="status"
    aria-live="polite"
  ></p>

  <!-- Loading screen -->
  <div id="load-screen" aria-live="polite">

      </h2>

      <div

        id="loadProgress"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"

          class="load-bar-fill"
          id="loadBarFill"
        ></div>
      </div>

      <p class="load-status" id="loadStatus">
        Initializing…
      </p>

      <button

        type="button"
        data-audio-toggle
        aria-pressed="false"

        ENABLE SOUND

    </div>
  </div>

    class="gw-logout-overlay"
    role="presentation"
    hidden

      aria-modal="true"

            fill="#f2b6bb"
            stroke="#202020"
            stroke-width="2"
          />
          <path
            d="M19 9 39 16V49L19 42Z"
            fill="#eeeeee"
            stroke="#202020"
            stroke-width="2"
          />
          <path
            d="M39 16H48Q51 16 51 20V25"
            stroke="#202020"
            stroke-width="2"
            stroke-linecap="round"
          />
          <path
            d="M35 31H57M49 23 57 31 49 39"
            stroke="#202020"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <p id="gw-logout-title" class="gw-logout-title">
        Oh no! You're leaving...
      </p>

      <p id="gw-logout-message" class="gw-logout-message">
        Are you sure?

      <button

        class="gw-logout-button gw-logout-stay"

      <button

        id="gw-logout-confirm"
        class="gw-logout-button gw-logout-leave"

        Yes, Log Me Out

    </div>

  <!-- Fullscreen controls -->
  <script>
    (function () {
      var button = document.getElementById('fullscreen-toggle');
      var status = document.getElementById('fullscreen-status');
      var target = document.getElementById('game-container');

      if (!button || !target) return;

      function isFullscreen() {
        return document.fullscreenElement === target ||
          document.webkitFullscreenElement === target;
      }

      function updateButton() {
        var label = isFullscreen()
          ? 'Exit full screen'
          : 'Enter full screen';

        button.setAttribute('aria-label', label);
        button.title = label;
      }

      function showError(error) {
        console.warn('[GW] Full-screen mode is unavailable:', error);

        if (status) {
          status.textContent =
            'Full-screen mode is unavailable in this browser.';
        }
      }

      function toggleFullscreen() {
        var action;
        var supported = false;

        try {
          if (isFullscreen()) {
            if (document.exitFullscreen) {
              action = document.exitFullscreen();
              supported = true;
            } else if (document.webkitExitFullscreen) {
              action = document.webkitExitFullscreen();
              supported = true;
            }
          } else {
            if (target.requestFullscreen) {
              action = target.requestFullscreen();
              supported = true;
            } else if (target.webkitRequestFullscreen) {
              action = target.webkitRequestFullscreen();
              supported = true;
            }
          }
        } catch (error) {
          showError(error);
          return;
        }

        if (!supported) {
          showError(new Error('Fullscreen API is not supported.'));
        } else if (action && typeof action.then === 'function') {
          action.then(updateButton).catch(showError);
        } else {
          window.setTimeout(updateButton, 0);
        }
      }

      window.GWFullscreen = {
        toggle: toggleFullscreen
      };

      button.addEventListener('click', toggleFullscreen);

      window.addEventListener('gw:pause-open', function () {
        button.hidden = false;
      });

      window.addEventListener('gw:pause-close', function () {
        button.hidden = true;
      });

      document.addEventListener('keydown', function (event) {
        var targetTag = event.target && event.target.tagName;

        if (
          event.key.toLowerCase() !== 'f' ||
          event.altKey ||
          event.ctrlKey ||
          event.metaKey ||
          ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(targetTag) !== -1
        ) {
          return;
        }

        event.preventDefault();
        toggleFullscreen();
      });

      document.addEventListener('fullscreenchange', updateButton);
      document.addEventListener('webkitfullscreenchange', updateButton);
    })();
  </script>

 <!-- Logout modal controls -->
<script>
(function () {
  'use strict';

  var modal = document.getElementById('gw-logout-modal');
  var cancel = document.getElementById('gw-logout-cancel');
  var confirm = document.getElementById('gw-logout-confirm');

  if (!modal || !cancel || !confirm) return;

  // Always start with the modal closed.
  modal.hidden = true;

  function openModal() {
    modal.hidden = false;
    cancel.focus();
  }

  function closeModal() {
    modal.hidden = true;
  }

  window.GWLogoutModal = {
    open: openModal,
    close: closeModal
  };

  // Only an explicit logout-button click opens the modal.
  document.addEventListener('click', function (event) {
    var button = event.target.closest('[data-action="logout"]');

    if (!button) return;

    event.preventDefault();
    openModal();
  });

  cancel.addEventListener('click', closeModal);

  modal.addEventListener('click', function (event) {
    if (event.target === modal) {
      closeModal();
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && !modal.hidden) {
      closeModal();
    }
  });

  // Keep your existing logout-confirmation handler here.
})();
</script>

  <script src="public/js/main.js"></script>
